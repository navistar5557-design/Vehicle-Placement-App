services:
  - type: web
    name: cube-vehicle-placement-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cube_vehicle_placement
