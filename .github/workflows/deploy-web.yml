name: Deploy Web Portal to GitHub Pages

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('web-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check web JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/ai-analysis.mjs
      - name: Run web tests
        run: node --test $(find web -maxdepth 1 -name '*test.mjs' ! -name '*browser*' -print)

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Mercedes sidebar asset
        run: |
          cat web/.asset-chunks/benz-sidebar-*.b64 | base64 --decode > web/benz-container-sidebar.webp
          test -s web/benz-container-sidebar.webp
          rm -rf web/.asset-chunks
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Wait for Pages artifact registration
        run: sleep 8
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
