name: Test, Build and Smoke Test Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm install
      - name: Check backend syntax
        run: npm run check

  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Compile debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Vehicle-Placement-App-test-build
          path: app/build/outputs/apk/debug/app-debug.apk

  smoke-test:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK for emulator
        run: gradle assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.cubelogistics.placement/.MainActivity
            sleep 5
            PID=$(adb shell pidof com.cubelogistics.placement || true); echo "PID=$PID"; adb logcat -d -v threadtime > /tmp/cube-logcat.txt; if [ -z "$PID" ]; then echo "APP_CRASHED"; grep -E "AndroidRuntime|FATAL EXCEPTION|Process: com.cubelogistics.placement|com.cubelogistics.placement" -A 100 -B 30 /tmp/cube-logcat.txt || true; exit 1; fi
            adb shell dumpsys activity activities | grep -q "com.cubelogistics.placement/.MainActivity" || (echo "MAIN_ACTIVITY_NOT_RESUMED"; tail -n 300 /tmp/cube-logcat.txt; exit 1)
            echo "APP_LAUNCH_OK"
            adb shell input tap 160 475
            sleep 3
            PID2=$(adb shell pidof com.cubelogistics.placement || true); echo "POST_LOGIN_PID=$PID2"; if [ -z "$PID2" ]; then echo "APP_CRASHED_AFTER_LOGIN"; adb logcat -d -v threadtime | grep -E "AndroidRuntime|FATAL EXCEPTION|Process: com.cubelogistics.placement|com.cubelogistics.placement" -A 100 -B 30 || true; exit 1; fi
            adb shell uiautomator dump /sdcard/cube-window.xml >/dev/null || true
            adb shell cat /sdcard/cube-window.xml | grep -q "Hello, Naveen" || (echo "DASHBOARD_NOT_VISIBLE"; adb shell cat /sdcard/cube-window.xml || true; exit 1)
            echo "LOGIN_DASHBOARD_OK"
