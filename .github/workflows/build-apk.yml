name: Test, Build and Smoke Test Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Compile debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Vehicle-Placement-App-test-build
          path: app/build/outputs/apk/debug/app-debug.apk

  smoke-test:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK for emulator
        run: gradle assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.cubelogistics.placement/.MainActivity
            sleep 5
            echo "PID:"
            PID=$(adb shell pidof com.cubelogistics.placement || true)
            echo "$PID"
            if [ -z "$PID" ]; then
              echo "APP_CRASHED"
              adb logcat -d -v threadtime | grep -E "AndroidRuntime|FATAL EXCEPTION|com.cubelogistics.placement|Process: com.cubelogistics.placement" -A 80 -B 20 || true
              exit 1
            fi
            adb shell dumpsys activity activities | grep -q "com.cubelogistics.placement/.MainActivity" || {
              echo "MAIN_ACTIVITY_NOT_RESUMED"
              adb logcat -d -v color | tail -n 300
              exit 1
            }
            echo "APP_LAUNCH_OK"
